---
layout: default
---

<article class="page-wrap">
  <header class="page-header">
    <p class="eyebrow">{{ page.kicker | default: "Page" }}</p>
    <h1>{{ page.title | escape_once }}</h1>
    {% if page.description %}
      <p>{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="page-content{% unless page.prose == false %} article-prose{% endunless %}">
    {{ content }}
  </div>
</article>

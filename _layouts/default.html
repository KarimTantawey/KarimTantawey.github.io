<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090d12">
    <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
    {% seo %}
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script defer src="{{ '/assets/js/main.js' | relative_url }}"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span class="brand-text">
          <strong>{{ site.title }}</strong>
          <small>{{ site.author.role }}</small>
        </span>
      </a>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}><i data-lucide="terminal" aria-hidden="true"></i><span>Home</span></a>
        <a href="{{ '/posts/' | relative_url }}"{% if page.url == '/posts/' or page.layout == 'post' %} aria-current="page"{% endif %}><i data-lucide="book-open-text" aria-hidden="true"></i><span>Posts</span></a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}><i data-lucide="fingerprint" aria-hidden="true"></i><span>About</span></a>
      </nav>
    </header>

    <main id="content" class="site-main" tabindex="-1">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div>
        <strong>{{ site.author.name }}</strong>
        <span>Web security notes, CTF writeups, and exploit research.</span>
      </div>
      <div class="footer-links">
        <a href="{{ site.author.discord_url }}" rel="me noopener" target="_blank"><i data-lucide="message-circle" aria-hidden="true"></i>{{ site.author.discord }}</a>
        <a href="{{ site.author.linkedin }}" rel="me noopener" target="_blank"><i data-lucide="linkedin" aria-hidden="true"></i>LinkedIn</a>
        <a href="{{ site.author.x }}" rel="me noopener" target="_blank"><i data-lucide="twitter" aria-hidden="true"></i>X</a>
        <a href="{{ site.author.cv | relative_url }}" download><i data-lucide="download" aria-hidden="true"></i>CV</a>
      </div>
    </footer>
  </body>
</html>

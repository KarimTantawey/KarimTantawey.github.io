<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1b1e1c">
    <script>
      try {
        if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light';
      } catch (error) {
        // Restricted storage keeps the default dark theme.
      }
    </script>
    <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <script defer src="{{ '/assets/js/main.js' | relative_url }}"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.author.name | downcase }}.</a>

      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/posts/' | relative_url }}"{% if page.url == '/posts/' or page.layout == 'post' %} aria-current="page"{% endif %}>Posts</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to light mode" title="Switch to light mode" hidden>
          <svg class="icon-sun" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><use href="{{ '/assets/icons.svg#sun' | relative_url }}"></use></svg>
          <svg class="icon-moon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><use href="{{ '/assets/icons.svg#moon' | relative_url }}"></use></svg>
        </button>
      </nav>
    </header>

    <main id="content" class="site-main" tabindex="-1">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>© {{ site.time | date: "%Y" }} {{ site.author.name }}</p>
      <nav class="footer-links" aria-label="Footer links">
        <a href="{{ site.author.discord_url }}" rel="me noopener" target="_blank"><svg aria-hidden="true" focusable="false" width="16" height="16"><use href="{{ '/assets/icons.svg#discord' | relative_url }}"></use></svg>Discord</a>
        <a href="{{ site.author.linkedin }}" rel="me noopener" target="_blank"><svg aria-hidden="true" focusable="false" width="16" height="16"><use href="{{ '/assets/icons.svg#linkedin' | relative_url }}"></use></svg>LinkedIn</a>
        <a href="{{ site.author.x }}" rel="me noopener" target="_blank"><svg aria-hidden="true" focusable="false" width="16" height="16"><use href="{{ '/assets/icons.svg#x' | relative_url }}"></use></svg>X</a>
        <a href="{{ site.author.cv | relative_url }}" download><svg aria-hidden="true" focusable="false" width="16" height="16"><use href="{{ '/assets/icons.svg#download' | relative_url }}"></use></svg>CV</a>
      </nav>
    </footer>
  </body>
</html>
